<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Práctica PyE — Primer parcial</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1b2430;--mut:#5b6877;--line:#d5dce5;--acc:#1f6f8b;--accb:#e3f1f6;--ok:#2a7a4b;--okb:#e1f3e8;--bad:#b0402f;--badb:#f9e5e1;--sel:#d6ebf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2c3744;--acc:#6bc0dc;--accb:#16303b;--ok:#6fcf97;--okb:#173325;--bad:#f08b7a;--badb:#3a1f1b;--sel:#1d3a47}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2c3744;--acc:#6bc0dc;--accb:#16303b;--ok:#6fcf97;--okb:#173325;--bad:#f08b7a;--badb:#3a1f1b;--sel:#1d3a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:600 1.35rem/1.2 "Source Serif 4",Georgia,serif;margin:4px 0 12px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{font-size:.85rem;color:var(--mut);display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,.opt:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.meta{font-size:.85rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stem{font-size:1.05rem;margin:8px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card)}
.opt input{margin-top:5px;accent-color:var(--acc)}
.opt.sel{background:var(--sel);border-color:var(--acc)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.bad{background:var(--badb);border-color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-weight:600}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.ans{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accb);white-space:pre-wrap}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.nav b{min-width:30px;text-align:center;padding:3px 0;font-weight:400;font-size:.8rem;border:1px solid var(--line);border-radius:5px;cursor:pointer}
.nav b.cur{outline:2px solid var(--acc)}.nav b.ok{background:var(--okb);border-color:var(--ok)}.nav b.bad{background:var(--badb);border-color:var(--bad)}
.opts-extra{font-size:.9rem;color:var(--mut);margin:6px 0}
.hide{display:none}
</style></head><body><main>
<h1>Práctica PyE — Primer parcial</h1>
<section class="panel" id="cfg">
<div class="row">
<label class="f">Parte<select id="tipo"><option value="all">Teóricas y prácticas</option><option value="T">Solo teóricas</option><option value="R">Solo prácticas</option></select></label>
<label class="f">Origen<select id="blk"><option value="all">Todos los bloques</option><option value="B1">Banco «Preg.»</option><option value="B2">Parcial Moodle</option><option value="B3">Teórico/práctico (págs. 86-132)</option><option value="B4">Banco numerado</option></select></label>
<label class="f">Orden<select id="ord"><option value="seq">En orden</option><option value="rnd">Aleatorio</option></select></label>
</div>
<div class="row" style="margin-top:10px"><button id="go">Empezar</button><button class="s" id="reset">Borrar mi progreso</button><button class="s" id="theme">Cambiar tema</button></div>
</section>
<section id="quiz" class="hide">
<div class="meta"><span id="pos"></span><span id="score"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="card"><div class="meta"><span id="src"></span><span id="kind"></span></div>
<div class="stem" id="stem"></div><div id="extra" class="opts-extra"></div><div id="opts"></div><div id="out"></div>
<div class="row" style="margin-top:12px"><button class="s" id="prev">Anterior</button><button id="chk">Comprobar</button><button class="s" id="next">Siguiente</button></div></div>
<div class="panel"><div class="meta">Ir a la pregunta</div><div class="nav" id="nav"></div></div>
</section></main>
<script>
const D={"T": [{"blk": "B1", "src": "Preg. 1", "stem": "En una muestra de pacientes, el número de varones dividido entre el total de pacientes es:", "opts": [["a", "Una frecuencia relativa."], ["b", "Una frecuencia absoluta."], ["c", "Una variable cuantitativa."], ["d", "Una variable cualitativa."], ["e", "Un valor de la variable."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 3", "stem": "Para comparar la variabilidad relativa de la tensión arterial diastólica y el nivel de colesterol en sangre de una serie de individuos, utilizamos", "opts": [["a", "Las desviaciones típicas."], ["b", "Los rangos."], ["c", "Los coeficientes de variación."], ["d", "La diferencia de las medias."], ["e", "La diferencia de las varianzas."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 4", "stem": "Si al calcular el coeficiente de correlación de dos variables X e Y, se tiene r=-0.20 ocurre que", "opts": [["a", "La pendiente de la recta de regresión es pequeña."], ["b", "La pendiente de la recta de regresión es grande."], ["c", "X e Y están poco relacionadas, aunque cuando X decrece, Y tiene tendencia a crecer."], ["d", "El modelo lineal de regresión explica el 20% de la varianza de una variable cualquiera en función de la otra."], ["e", "El modelo lineal de regresión explica el 80% de la varianza de una variable cualquiera en función de la otra."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 5", "stem": "La media aritmética de una variable cuantitativa:", "opts": [["a", "Es siempre un valor de la variable."], ["b", "No tiene sentido calcularla para variables discretas."], ["c", "Es el valor más representativo de una modalidad."], ["d", "Si la variable es discreta, puede no ser única."], ["e", "Existe siempre."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 6", "stem": "Las siguientes medidas son todas de centralización, excepto:", "opts": [["a", "La media."], ["b", "La moda."], ["c", "La mediana."], ["d", "Rango intercuartílico."], ["e", "El percentil 50."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 7", "stem": "La función de densidad de una variable aleatoria continua:", "opts": [["a", "Siempre es no negativa."], ["b", "Es la derivada de la función de distribución."], ["c", "El área encerrada por ella y el eje X vale uno."], ["d", "Todo lo anterior es cierto."], ["e", "Sólo (a) y (c) son correctas."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 9", "stem": "Se realiza una auditoría de historias clínicas tomando una primeria historia al azar y después sucesivamente, la que ocupa la vigésima posición detrás de la anterior. Este procedimiento de muestreo se denomina:", "opts": [["a", "Por conglomerados."], ["b", "Sistemático."], ["c", "Correlativo."], ["d", "Consecutivo."], ["e", "Equidistante."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 10", "stem": "Se realiza un estudio con objeto de determinar el tiempo de supervivencia en pacientes con cáncer. Para ello de los dos hospitales existentes en una ciudad, se selecciona aleatoriamente uno de ellos, y se elige una muestra aleatoria de pacientes, atendiendo al tipo de cáncer: El muestreo realizado es:", "opts": [["a", "Sistemático."], ["b", "Aleatorio."], ["c", "Por conglomerados."], ["d", "Estratificado."], ["e", "Por conglomerados y estratificado."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 13", "stem": "Qúe propiedad o propiedades caracterizan a una distribución normal tipificada frente a una distribución normal cualquiera:", "opts": [["a", "El área bajo su función de densidad es igual a 1."], ["b", "Su media es 1 y su desviación típica es 0."], ["c", "Su rango de valores oscila entre 0 y 3."], ["d", "Su media es 0 y su desviación típica es 1."], ["e", "Son ciertas (c) y (d)"]], "ans": "D"}, {"blk": "B1", "src": "Preg. 15", "stem": "¿Cómo se calcula la sensibilidad de un test diagnóstico?", "opts": [["a", "Contabilizando el número de tests positivos en una muestra aleatoria de individuos."], ["b", "Contabilizando el número de tests negativos en una muestra aleatoria de individuos."], ["c", "Contabilizando el número de tests positivos en una muestra aleatoria de enfermos."], ["d", "Contabilizando el número de tests negativos en una muestra aleatoria de sanos."], ["e", "Ninguna de las anteriores es cierta."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 17", "stem": "El nivel de significación de un test de hipótesis:", "opts": [["a", "Suele ser pequeño y lo fija el investigador o un convenio generalmente aceptado."], ["b", "Da la probabilidad de declarar significativo el resultado de un test, cuando esto es falso."], ["c", "Al disminuir hace aumentar la probabilidad del error de tipo II."], ["d", "Todo lo anterior es cierto."], ["e", "Todo lo anterior es falso."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 19", "stem": "Un estudio sobre la efectividad de un fármaco llega a la conclusión de que éste es mejor que el placebo con p<0,05 ¿Cuál es la interpretación correcta de este resultado?", "opts": [["a", "Con toda seguridad, el tratamiento es mejor que el placebo."], ["b", "La probabilidad de que el nuevo tratamiento sea mejor que el placebo es superior al 95%."], ["c", "El tratamiento es un 95% más efectivo que el placebo."], ["d", "La probabilidad de que el placebo sea mejor que el nuevo fármaco es menor de 5%. Si el tratamiento no fuese efectivo, existe menos del 5% de"], ["e", "probabilidad de observar unas muestras tan contrarias a dicha hipótesis como las obtenidas."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 20", "stem": "En un contraste de hipótesis la cantidad p es:", "opts": [["a", "Un número pequeño."], ["b", "Fijada antes de realizar el contraste."], ["c", "La probabilidad de rechazar la hipótesis nula."], ["d", "La probabilidad de error al rechazar la hipótesis alternativa."], ["e", "Conocida al extraer la muestra y calcular el estadístico experimental."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 21", "stem": "En todo contraste de hipótesis:", "opts": [["a", "Se acepta la hipótesis de mayor probabilidad."], ["b", "Se rechaza la hipótesis de menor probabilidad."], ["c", "La hipótesis nula se elige según el principio de simplicidad científica."], ["d", "Todo lo anterior es cierto."], ["e", "Es necesario contrastar la normalidad de los datos."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 22", "stem": "Un contraste de hipótesis se considera significativo si:", "opts": [["a", "Una muestra aleatoria es coherente con la hipótesis nula."], ["b", "Una muestra aleatoria no es coherente con la hipótesis nula."], ["c", "La hipótesis alternativa es más probable que la nula."], ["d", "Todo lo anterior es cierto."], ["e", "Son ciertas (b) y (c)."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 23", "stem": "Se desea estimar confidencialmente el número medio de veces que asiste a un servicio de salud los individuos de una población. Para ello se toman muestras aleatorias entre los individuos que asisten regularmente a los mismos. Esta técnica de muestreo es:", "opts": [["a", "Un muestreo aleatorio simple."], ["b", "Un muestreo aleatorio estratificado."], ["c", "Un muestreo aleatorio por conglomerados."], ["d", "Incorrecta."], ["e", "Ninguna de las anteriores."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 24", "stem": "Un contraste de hipótesis se considera no significativo si:", "opts": [["a", "Una muestra aleatoria es coherente con la hipótesis nula."], ["b", "Una muestra aleatoria no es coherente con la hipótesis nula."], ["c", "La hipótesis nula es más probable que la alternativa."], ["d", "Todo lo anterior es cierto."], ["e", "Son ciertas(a) y (c)."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 25", "stem": "Señale cuál de las siguientes afirmaciones es falsa:", "opts": [["a", "La aparición o no de bacterias en un cultivo es una variable dicotómica"], ["b", "La estatura de un individuo es una variable cuantitativa discreta."], ["c", "El lugar que ocupa una persona entre sus hermanos (de menor a mayor edad) es una variable ordinal."], ["d", "El estado civil es una variable cualitativa."], ["e", "La glucemia es continua."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 26", "stem": "¿Cuál de las siguientes características no se corresponde con el concepto de mediana?", "opts": [["a", "Es el centro de gravedad de la distribución."], ["b", "No se ve afectada por los valores extremos."], ["c", "Deja por debajo el mismo número de datos que por encima."], ["d", "Es el segundo cuartil."], ["e", "Todo lo anterior se corresponde con la mediana."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 28", "stem": "Señale cual de las siguientes afirmaciones es verdadera:", "opts": [["a", "La media, la mediana y el rango orientan sobre la tendencia central de los datos."], ["b", "La desviación típica me orienta sobre la \"validez\" de la media."], ["c", "El rango me orienta sobre la simetría de la distribución."], ["d", "Las marcas de clase de una variable cualitativa se calculan como los puntos medios de los intervalos."], ["e", "La media, mediana y moda resumen todo tipo de información de los datos."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 31", "stem": "Señale cuál de las siguientes afirmaciones es falsa:", "opts": [["a", "La media aritmética es siempre el centro de gravedad de la distribución."], ["b", "En una distribución continua simétrica, media y mediana coinciden."], ["c", "La media aritmética cambia cuando cambia algún dato."], ["d", "La mediana no siempre cambia cuando lo hace algún dato."], ["e", "En las distribuciones continuas simétricas todas las medidas de centralización coinciden."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 32", "stem": "El coeficiente de variación:", "opts": [["a", "Permite comparar la dispersión de dos poblaciones."], ["b", "Es menor que la media."], ["c", "Es menor que la desviación típica."], ["d", "No depende de la media ni la desviación típica."], ["e", "Depende de la escala que se use al medir la variable."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 33", "stem": "Los diagramas de sectores son muy útiles para comparar:", "opts": [["a", "Dos variables cualitativas en una población."], ["b", "Dos variables cuantitativas en una población."], ["c", "Una variable cualitativa en dos poblaciones."], ["d", "Una variable cuantitativa en dos poblaciones."], ["e", "Una variable cuantitativa con otra cualitativa."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 34", "stem": "En el caso de una variable ordinal, el número n de datos válidos es:", "opts": [["a", "La suma de las frecuencias absolutas."], ["b", "La frecuencia absoluta acumulada de la categoría más frecuente."], ["c", "La suma de las frecuencias relativas."], ["d", "La frecuencia relativa acumulada en la última catetgoría."], ["e", "La (a) y la (d) son ciertas."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 35", "stem": "La recta de regresión de Y sobre X se muestra como una buen modelo para explicar la relación entre dos variables numéricas. Entonces:", "opts": [["a", "Y se puede calcular exactamente como una función matemática de X."], ["b", "Y es independiente de X."], ["c", "La covarianza de X e Y no es nula."], ["d", "La media de X coincide con la media de Y."], ["e", "Sólo dos de las afirmaciones anteriores son correctas."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 37", "stem": "Dos variables numéricas son incorreladas. Entonces:", "opts": [["a", "r=0."], ["b", "El modelo lineal de regresión sólo propone un valor como predicción de Y."], ["c", "La nube de puntos no presenta aspecto creciente."], ["d", "La varianza residual en el modelo de regresión de Y sobre X es igual a la varianza de Y."], ["e", "Todo lo anterior es cierto."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 38", "stem": "Se pide a unos enfermos que valoren su grado de mejoría tras un tratamiento en una escala de 1 a 5. De la siguiente colección de posibilidades, cuál cree que resume mejor los mismos:", "opts": [["a", "Media, Mediana y Moda."], ["b", "Percentil 25, Percentil 50, Percentil 75."], ["c", "Media y desviación típica."], ["d", "Mediana y desviación típica."], ["e", "Rango"]], "ans": "B"}, {"blk": "B1", "src": "Preg. 39", "stem": "Al aplicar un tratamiento a un paciente, puede que este empeore, no le haga efecto, o mejore. Si dicho tratamiento se aplica a una población de 100 pacientes, ¿qué medidas cree que resumen mejor los datos?", "opts": [["a", "Media, mediana, moda, desviación típica y asimetría."], ["b", "Mediana y coeficiente de variación."], ["c", "Media y coeficiente de variación."], ["d", "Percentil 25, percentil 50 y percentil 75."], ["e", "Ninguna de las anteriores."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 40", "stem": "En cierta población se observa la distribución de los grupos sanguíneos. Si queremos resumir la información obtenida podemos utilizar:", "opts": [["a", "Moda."], ["b", "Mediana."], ["c", "Frecuencias acumuladas absolutas."], ["d", "Frecuencias relativas."], ["e", "Nada de lo anterior."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 41", "stem": "De las siguientes medidas, cuáles podria utilizar para argumentar en favor o en contra de la asimetría de la variable edad:", "opts": [["a", "Percentil 25 y percentil 75."], ["b", "Media y Percentil 60."], ["c", "Media y mediana"], ["d", "Media y desviación típica."], ["e", "Ninguna de las anteriores."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 42", "stem": "La pregunta: ¿qué nivel de colesterol sólo es superado por el 5% de los individuos?, tiene por respuesta:", "opts": [["a", "El percentil 95."], ["b", "El percentil 5."], ["c", "Los percentiles 2,5 y 97,5"], ["d", "95%."], ["e", "Nada de lo anterior."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 43", "stem": "Qué peso no llega a alcanzar el 40% de los individuos de una población:", "opts": [["a", "El 40%."], ["b", "El 60%."], ["c", "El percentil 60."], ["d", "El percentil 40."], ["e", "Los percentiles 20 y 60."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 44", "stem": "Una distribución presenta asimetría negativa siempre que:", "opts": [["a", "Hay más valores negativos que positivos."], ["b", "Hay menos valores negativos que positivos."], ["c", "No es simétrica."], ["d", "La media es menor que la varianza."], ["e", "Nada de lo anterior es cierto."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 45", "stem": "La media aritmética de una variable discreta:", "opts": [["a", "Puede ser un valor de la variable."], ["b", "No debería ser utilizada como medida de centralización."], ["c", "Es lo mismo que el percentil 50."], ["d", "Puede no ser única."], ["e", "Todo lo anterior es falso."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 46", "stem": "En un estudio sobre problemas cervicales preguntamos a los pacientes acerca del tipo de almohada que usan. Las respuestas deberían ser consideradas como una variable:", "opts": [["a", "Cualitativa nominal"], ["b", "Numérica"], ["c", "Discreta"], ["d", "Continua."], ["e", "Ordinal"]], "ans": "A"}, {"blk": "B1", "src": "Preg. 47", "stem": "En un intervalo de confianza para una media, buscamos disminuir el margen de error. Cuál de las siguientes posibilidades nos permite realizarlo:", "opts": [["a", "Aumentar el tamaño muestral y la confianza."], ["b", "Aumentar el tamaño muestral y disminuir la confianza."], ["c", "Aumentar la confianza."], ["d", "Disminuir la varianza muestral."], ["e", "Aumentar la varianza muestral."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 48", "stem": "En relación a las técnicas de inferencia estadística, elija la afirmación correcta:", "opts": [["a", "La media poblacional es una estimación puntual."], ["b", "La media muestral es un parámetro."], ["c", "Sólo se rechaza una hipótesis nula si esta es falsa."], ["d", "Un intervalo de confianza es una estimación confidencial de un parámetro."], ["e", "Todo lo anterior es falso."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 49", "stem": "En relación con los contrastes de hipótesis, elija la afirmación correcta:", "opts": [["a", "La hipótesis nula es la correcta."], ["b", "La hipótesis nula es la falsa."], ["c", "Si la hipótesis alternativa es cierta, seguro que se rechaza la nula."], ["d", "El contraste es significativo cuando los datos muestrales no son los esperados si la hipótesis nula fuese cierta,"], ["e", "Si es más probable que sea cierta la hipótesis alternativa que la nula, el contraste es significativo."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 50", "stem": "Se realiza un estudio para saber si dos tratamientos de quimioterapia presentan diferencias en cuanto a la supervivencia de los pacientes. No se encontró diferencia estadísticamente significativa. ¿Cuál de las siguientes razones podrían ser causantes del resultado?", "opts": [["a", "Los tratamientos ofrecen tiempos de supervivencia muy diferentes."], ["b", "El nivel de significación es demasiado alto."], ["c", "Las muestras son demasiado numerosas."], ["d", "Las muestras son demasiado pequeñas."], ["e", "Nada de lo anterior."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 51", "stem": "Elija la afirmación correcta sobre variables observadas en individuos:", "opts": [["a", "Poseer vivienda propia es una variable numérica."], ["b", "Poseer animales de compañía es una variable cualitativa."], ["c", "La nacionalidad es una variable ordinal."], ["d", "El tipo de almohada que usa es variable ordinal."], ["e", "La longitud de la cama donde duerme es variable discreta."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 52", "stem": "Se pregunta a los individuos su opinión sobre una cuestión, pudiendo valorar estos su respuesta en términos de: en contra, en parte a favor, muy a favor, totalmente de acuerdo. Elija la afirmación correcta:", "opts": [["a", "Podemos calcular la media."], ["b", "Podemos calcular el coeficiente de variación."], ["c", "La variable es de tipo ordinal"], ["d", "La variable es de tipo cualitativo nominal."], ["e", "Nada de lo anterior es cierto."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 53", "stem": "Un estadístico es:", "opts": [["a", "Un valor numérico definido sobre los valores de una muestra."], ["b", "La media muestral."], ["c", "Un valor numérico definido sobre los valores de una población."], ["d", "Un individuo de una muestra."], ["e", "Ninguna de las anteriores son correctas"]], "ans": "A"}, {"blk": "B1", "src": "Preg. 54", "stem": "De las siguientes, cuál se corresponde con un error de tipo II:", "opts": [["a", "Aceptar que un tratamiento ineficaz produce efectos útiles."], ["b", "Rechazar que un tratamiento ineficaz produce efectos útiles."], ["c", "Aceptar que un tratamiento eficaz produce efectos útiles."], ["d", "Rechazar que un tratamiento eficaz produce efectos útiles."], ["e", "Nada de lo anterior es cierto."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 56", "stem": "La estadística en Ciencias de la Salud se utiliza para obtener información sobre situaciones de caracter:", "opts": [["a", "Determinista."], ["b", "Sistemático."], ["c", "Exhaustivo."], ["d", "Aleatorio."], ["e", "Excluyente."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 57", "stem": "Elija la afirmación que pueda considerarse admisible al leer un estudio estadístico:", "opts": [["a", "Se estudió a una muestra en vez de a la población, para mayor precisión."], ["b", "Se estudió a la población para obtener información sobre la muestra."], ["c", "Se estudió a una muestra representativa de la población."], ["d", "Se estudiaron todas las variables de la población."], ["e", "Se observó a un individuo de cada variable."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 58", "stem": "Elija la afirmación correcta:", "opts": [["a", "Los valores de cualquier variable deben ser agrupados en intervalos."], ["b", "Las variables deben ofrecer valores que no se repitan en los diferentes individuos."], ["c", "Las modalidades de una variable deben poder ser observadas en todos los individuos."], ["d", "Los individuos pueden poseer diferentes modalidades de la misma variable."], ["e", "Todo lo anterior es falso."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 59", "stem": "En cuanto a la presentación ordenada del estudio de una variable aislada:", "opts": [["a", "Lo más informativo es mostrar las medidas de tendencia central l 70% de las alturas consideradas \"más normales\" se encuentran:", "opts": [["a", "Por encima del percentil 70."], ["b", "Por debajo del cuantil 0,30"], ["c", "Entre el percentil 30 y el 70"], ["d", "Entre el percentil 15 y el 85."], ["e", "Entre la media y la mediana."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 65", "stem": "Las medidas de centralización, en cuanto a la información que ofrecen sobre una variable numérica, preferimos (por orden, de peor a mejor):", "opts": [["a", "media, mediana, moda"], ["b", "moda, media, mediana"], ["c", "media, moda, mediana."], ["d", "No se puede en general recomendar una como mejor que las otras."], ["e", "Todo lo anterior es falso."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 66", "stem": "Si una muestra posee valores anómalos, de las siguientes cuál usarías como medida de dispersión:", "opts": [["a", "Varianza."], ["b", "Desviación típica."], ["c", "Rango intercuartílico."], ["d", "Rango."], ["e", "Máximo y coeficiente de variación."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 67", "stem": "Si queremos saber cómo de disperso está una variable relativamente con respecto a la magnitud de los valores centrales de la misma, usaremos:", "opts": [["a", "Varianza."], ["b", "Desviación típica."], ["c", "Rango intercuartílico."], ["d", "Rango."], ["e", "Coeficiente de variación."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 68", "stem": "Si el coeficiente de asimetría en una población presenta el valor 0,99 entonces:", "opts": [["a", "La distribución presenta una cola a la derecha."], ["b", "La distribución presenta una cola a la izquierda."], ["c", "La distribución es más apuntada que la normal."], ["d", "La distribución es menos apuntada que la normal."], ["e", "La distribución es prácticamente simétrica."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 69", "stem": "Si la media del peso en una población es 60 kg. y la mediana 65kg., entonces afirmamos que la distribución del peso en la población es:", "opts": [["a", "Platicúrtica."], ["b", "Mesocúrtica."], ["c", "Leptocúrtica."], ["d", "Asimétrica."], ["e", "Unimodal."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 70", "stem": "De las siguientes parejas de variables, en cuáles crees que puede ser útil un análisis de regresión lineal:", "opts": [["a", "La presión sanguínea y el grupo sanguíneo."], ["b", "El nivel de colesterol y la concentración de bilirrubina."], ["c", "El grupos sanguíneo y el factor Rh."], ["d", "El género y la edad."], ["e", "Poseer ideología racista y el factor RH."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 71", "stem": "Si el coeficiente de correlación lineal de Pearson entre dos variables es - 0,8 podemos decir:", "opts": [["a", "La covarianza es negativa."], ["b", "La relación entre las variables es directa."], ["c", "Hay poca relación lineal entre las variables."], ["d", "Hay un error de cálculo."], ["e", "El 80% de las predicciones son correctas."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 72", "stem": "En un estudio de regresión lineal, donde el peso se estudie conjuntamente con otras variables, en qué casos lo usarías como variable dependiente:", "opts": [["a", "Al estudiarlo con la altura."], ["b", "Al estudiarlo con el nivel del colesterol."], ["c", "Al estudiarlo con la presión sanguínea."], ["d", "Al estudiarlo con el grupo sanguíneo."], ["e", "Nada de lo anterior."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 73", "stem": "En una población formada por unidades familiares, la altura media del padre en la familia se comporta como una distribución normal de media 170cm con desviación típica 5 cm. La altura del primer hijo varón es otra variable con distribución similar. Con estos datos podemos afirmar:", "opts": [["a", "No hay relación entre ambas variables."], ["b", "Hay relación inversa entre las variables."], ["c", "No debemos intentar predecir la altura del hijo de un padre que mide 140cm."], ["d", "Hay relación directa entre las variables."], ["e", "Nada de lo anterior."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 74", "stem": "El porcentaje de individuos fumadores o con bronquitis se puede interpretar como una probabilidad:", "opts": [["a", "De un suceso intersección"], ["b", "Condicionada."], ["c", "De un suceso unión."], ["d", "A posteriori."], ["e", "De un suceso complementario."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 75", "stem": "El porcentaje de individuos con bronquitis entre los fumadores se puede interpretar como una probabilidad:", "opts": [["a", "De un suceso intersección"], ["b", "Condicionada."], ["c", "De un suceso unión."], ["d", "A posteriori."], ["e", "De un suceso complementario."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 76", "stem": "El porcentaje de individuos con bronquitis que además son fumadores se puede interpretar como una probabilidad:", "opts": [["a", "De un suceso intersección"], ["b", "Condicionada."], ["c", "De un suceso unión."], ["d", "A posteriori."], ["e", "De un suceso complementario."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 79", "stem": "Elija la afirmación correcta relativa a pruebas diagnósticas:", "opts": [["a", "La sensibilidad se obtiene usando la noción subjetiva de probabilidad."], ["b", "El índice predictivo positivo se obtiene directamente de la noción frecuentista de probabilidad."], ["c", "La tasa de verdaderos positivos se obtiene directamente de la noción frecuentista de probabilidad."], ["d", "La prevalencia de la enfermedad se obtiene a partir del teorema de Bayes."], ["e", "nada de lo anterior es cierto."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 80", "stem": "De los siguientes, qué me puede servir directamente para saber si una observación de una variable aleatoria es anómala:", "opts": [["a", "El valor de la función de densidad."], ["b", "El valor de la función de distribución."], ["c", "El valor esperado de la variable."], ["d", "El valor de la varianza."], ["e", "Nada de lo anterior."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 82", "stem": "Deseamos conocer la opinión de los ciudadanos de Málaga sobre el sistema de salud pública. Para ello elegimos una muestra aleatoria de entre los abonados a telefónica. Entonces:", "opts": [["a", "La población de estudio es la de los ciudadanos de Málaga."], ["b", "La población de estudio es la de los abonados a telefónica."], ["c", "La población objetivo es la de los abonados a telefónica."], ["d", "El conjunto de abonados a telefónica son la muestra."], ["e", "Nada de lo anterior es cierto."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 83", "stem": "Se quiere hacer un estudio sobre el tabaquismo en la provincia de Málaga. Queremos asegurarnos tener cierto número de individuos de la zona litoral, la capital y del interior, pues creemos que en cada una de esas zonas la incidencia es diferente. Haremos un muestreo:", "opts": [["a", "Aleatorio simple."], ["b", "Estratificado."], ["c", "Sistemático."], ["d", "Por grupos."], ["e", "No probabilístico."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 84", "stem": "Una estimación confidencial para un nivel de confianza fijado, da por respuesta:", "opts": [["a", "Una aproximación de la media."], ["b", "Una aproximación de una proporción."], ["c", "Una probabilidad."], ["d", "Un intervalo."], ["e", "Un nivel de significación."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 85", "stem": "Se realiza un experimento donde nos basaremos en un contraste de hipótesis para tomar una decisión con un nivel de significación del 1%. De las siguientes cuál no es un resultado posible de un contraste de hipótesis:", "opts": [["a", "El experimento no es concluyente."], ["b", "El experimento permite obtener conclusiones."], ["c", "Se rechaza la hipótesis nula."], ["d", "Se rechaza la hipótesis alternativa."], ["e", "Se acepta la hipótesis alternativa."]], "ans": "D"}, {"blk": "B1", "src": "Preg. 86", "stem": "En un contraste de hipótesis, típicamente, la región crítica:", "opts": [["a", "Tiene probabilidad pequeña, si la hipótesis nula fuese cierta."], ["b", "Esta situada en la zona de mayor probabilidad, si nclusive hasta 249244 mg", "b) En 9 de las horas seleccionadas se ha observado que la máquina descarga 248485 o más pero menos de 248738 mg", "c) En 249244 o más pero en menos de 249497 de las horas se ha observado que la máquina descarga 0,21 mg", "d) En una proporción de 0,04 de las horas se ha observado que la máquina descarga 249750 o más pero menos de la máxima cantidad observada de mg", "e) En un porcentaje de 0,07 de las horas se ha observado que la máquina descarga menos de 249750 mg", "f) Entre 248738 y 248991 de las horas se ha observado que la máquina descarga aproximadamente 0,19 mg"], "c": [0, 3], "m": true}]}, {"blk": "B3", "src": "Teórico/Práctico T7", "stem": "Cuando se quiere comparar la dispersión de dos conjuntos de datos, si las variables tienen diferentes unidades de medición, y aun con las mismas unidades pueden ser conjuntos no comparables directamente, entonces se utiliza:", "parts": [{"p": "", "o": ["a) Coeficiente de curtosis", "b) Coeficiente de asimetría", "c) Coeficiente de Pearson", "d) Coeficiente estándar", "e) Coeficiente medio", "f) Coeficiente de variación"], "c": [5], "m": false}]}, {"blk": "B3", "src": "Teórico/Práctico T8", "stem": "Las medidas descriptivas media, moda y mediana son:", "parts": [{"p": "", "o": ["a) Tres estadísticos de la población", "b) Tres parámetros muestrales", "c) Medidas obligatorias de calcular", "d) Medidas de centralización", "e) Medidas descriptivas de variabilidad"], "c": [3], "m": false}]}, {"blk": "B3", "src": "Teórico/Práctico T9", "stem": "La ____ de un intervalo es el total de todas las frecuencias de todos los intervalos anteriores, incluyendo el intervalo actual.", "parts": [{"p": "Completar", "o": ["Densidad Relativa Acumulada", "Densidad Absoluta Acumulada", "Frecuencia Acumulada", "Frecuencia Absoluta", "Frecuencia Relativa"], "c": [2], "m": false}]}, {"blk": "B3", "src": "Teórico/Práctico T10", "stem": "Complete: «Al ser la [1] aquel valor de una variable [2] que se ha observado en una [3] ótesis alternativa.", "opts": [["a", "La hipótesis HO es una conjetura o aseveración que se hace sobre valores poblacionales y la H, es una conjetura o aseveración que se hace sobre valores muestrales."], ["b", "La Hipótesis Nula es una decisión estadística, que se toma con respecto a algún aspecto de la población, y la Hipótesis Alternativa es una decisión tomada en base a evidencias proporcionadas por las muestras."], ["c", "Ho es la probabilidad de aceptar la hipótesis, bajo supuesto de ser cierta y la Hipótesis alternativa es la probabilidad de rechazarla siendo cierta."], ["d", "Hipótesis Nula indica la presencia de cambios o efectos en la población y la Hipótesis Alternativa indica que no se han producido en la población. efectos o cambios"], ["e", "Hipótesis Nula indica que no se han producido en la población efectos o cambios y la Hipótesis Alternativa indica la presencia de cambios o efectos en la población"]], "ans": "E"}, {"blk": "B4", "src": "Banco 4", "stem": "La tendencia de las características mensurables a concentrarse alrededor de una medida de tendencia central del que las observaciones individuales divergen en cierta forma definida tiene que ver con:", "opts": [["a", "La disparidad"], ["b", "La uniformidad o regularidad"], ["c", "La variedad"], ["d", "La diversidad"], ["e", "La pluralidad"]], "ans": "B"}, {"blk": "B4", "src": "Banco 6", "stem": "Para los eventos C y E que pertenecen a la familia de eventos de un mismo espacio probabilístico, uno de los siguientes enunciados es incorrecto, ¿cuál es?", "opts": [["a", "Los eventos C y E son no mutuamente excluyentes cuando Pr(E n C) es distinta de 0 y porque Pr(C u E) es distinta al resultado de Pr(C) + Pr(E)"], ["b", "Los eventos C y E son mutuamente excluyentes cuando Pr(C) sea mayor a O, Pr(E) sea mayor a O y porque Pr(E n C) es igual a O"], ["c", "Los eventos C y E son estadísticamente independientes cuando Pr(C / E) es igual al resultado de Pr(C) . Pr(E) y porque es igual a Pr(E)"], ["d", "Los eventos E y C son estadísticamente independientes y no mutuamente excluyentes cuando Pr(C / E) sea igual a Pr(C) y porqué Pr(C u E) es distinta al resultado de Pr(E) + Pr(C)"], ["e", "Los eventos E y C son estadÊticamente dependientes y mutuamente excluyentes cuando Pr(E / C) sea igual a O y porque Pr(C n E) es igual a O"]], "ans": "C"}, {"blk": "B4", "src": "Banco 7", "stem": "Una de las siguientes distribuciones de probabilidad corresponde a una variable discreta.", "opts": [["a", "Chi-Cuadrado"], ["b", "Normal"], ["c", "t de Student"], ["d", "Hipergeométrica"], ["e", "Exponencial"]], "ans": "D"}, {"blk": "B4", "src": "Banco 8", "stem": "En una estimación por intervalos de la media poblacional en donde se aplica distribución normal, en el denominador del estadístico Z se utiliza:", "opts": [["a", "La desviación estándar de la media muestral"], ["b", "La varianza de la proporción"], ["c", "La varianza de la media muestral"], ["d", "La varianza de x"], ["e", "La desviación de la proporción muestral"]], "ans": "A"}, {"blk": "B4", "src": "Banco 9", "stem": "Para el cálculo del tamaño de muestra es necesario disponer valores de", "opts": [["a", "La desviación típica de la variable en la población, el error máximo de muestreo que se está dispuesto a aceptar y el riesgo para la estimación."], ["b", "El error máximo de muestreo que se está dispuesto a aceptar, la desviación típica de la variable en la población y el nivel de confianza para la estimación"], ["c", "La desviación típica del estimador, el nivel de confianza y el riesgo para la estimación"], ["d", "El error máximo de muestreo que se está dispuesto a aceptar y la desviación típica del estimador"], ["e", "El error máximo de muestreo que se está dispuesto a aceptar y el nivel de confianza para la estimación"]], "ans": "B"}, {"blk": "B4", "src": "Banco 10", "stem": "En todo contraste de hipótesis:", "opts": [["a", "Se acepta la hipótesis de mayor probabilidad."], ["b", "Todas las otras son verdaderas"], ["c", "Es necesario contrastar la normalidad de los datos."], ["d", "La hipótesis nula se elige según el principio de simplicidad científica."], ["e", "Se rechaza la hipótesis de menor probabilidad."]], "ans": "B"}, {"blk": "B4", "src": "Banco 11", "stem": "Una medida de resumen que describe a una población es:", "opts": [["a", "Estadística"], ["b", "Variable"], ["c", "Estadístico"], ["d", "Parámetro"], ["e", "Atributo"]], "ans": "D"}, {"blk": "B4", "src": "Banco 13", "stem": "Para la selección de una muestra representativa se deben tener en cuenta dos criterios:", "opts": [["a", "Durabilidad y efectividad"], ["b", "Efectividad y representatividad"], ["c", "Imparcialidad y efectividad"], ["d", "Fiabilidad y efectividad"], ["e", "Representatividad y fiabilidad"]], "ans": "D"}, {"blk": "B4", "src": "Banco 15", "stem": "Si algún proceso es repetido un gran número de veces, n, y si algún evento resultante, con la característica E, ocurre m veces, la frecuencia de la ocurrencia de E, m/n , es aproximadamente igual a la probabilidad de E. P(E)= m/n esto es según:", "opts": [["a", "Teórica subjetiva"], ["b", "Teoría de la frecuencia relativa"], ["c", "Teoría de la frecuencia absoluta"], ["d", "Teoría clásica"], ["e", "Teoría de Bayes"]], "ans": "B"}, {"blk": "B4", "src": "Banco 16", "stem": "Cuanto mayor sea la muestra. mayor será el error de muestreo.", "opts": [["a", "No. disminuye"], ["b", "NO, aumenta"], ["c", "Si porque hay más errores"], ["d", "Ninguna de las otras es correcta"], ["e", "No hay relación alguna"]], "ans": "A"}, {"blk": "B4", "src": "Banco 17", "stem": "A veces se habla de medias ponderadas", "opts": [["a", "No existe el concepto de medias ponderadas"], ["b", "Se suman las medias, multiplicadas por sus respectivas frecuencias totales y se divide por todas las frecuencias totales sumadas."], ["c", "Se suman las medias previas y se divide por el total"], ["d", "Todas las otras opciones son incorrectas"], ["e", "Se suman las medias y se divide por el número de medias sumadas"]], "ans": "B"}, {"blk": "B4", "src": "Banco 20", "stem": "Si la variable aleatoria X toma los valores x1, x2, xk con idénticas probabilidades, la distribución de probabilidades está dada por f(x;k)= 1/k", "opts": [["a", "Poisson"], ["b", "Uniforme continua"], ["c", "Uniforme discreta"], ["d", "Hipergeométrica"], ["e", "Binomial"]], "ans": "C"}, {"blk": "B4", "src": "Banco 21", "stem": "En una estimación por intervalos de la proporción poblacional en el denominador del estadístico para inferencias (k = Z) se utiliza:", "opts": [["a", "La desviación estándar del tamaño de muestra"], ["b", "La desviación estándar de la proporción muestral"], ["c", "La varianza de la proporción muestral"], ["d", "La desviación estándar de la proporción poblacional"], ["e", "La desviación estándar del error de estimación"]], "ans": "B"}, {"blk": "B4", "src": "Banco 23", "stem": "Es un caso especial del muestreo por juicio y se lo suele utilizar en encuestas de opinión, investigaciones de mercados, etc. Es el :", "opts": [["a", "Muestreo por conveniencias"], ["b", "Muestreo aleatorio"], ["c", "Muestreo de la muestra disponible"], ["d", "Muestreo por cuotas"], ["e", "Muestra sistemático"]], "ans": "D"}, {"blk": "B4", "src": "Banco 25", "stem": "Este enfoque sostiene que la probabilidad mide la confianza que un individuo tiene en la certeza de una proposición determinada. Este concepto no depende de la repetibilidad de ningún proceso. Se hace uso de la intuición, las creencias personales y otra información indirecta para llegar a probabilidades Se trata de la teoría:", "opts": [["a", "Frecuencia relativa"], ["b", "Subjetiva"], ["c", "Clásica d Bayes"], ["e", "Frecuencia absoluta"]], "ans": "B"}, {"blk": "B4", "src": "Banco 26", "stem": "En una distribución asimétrica negativa o izquierda:", "opts": [["a", "La media se sitúa en el mismo lugar que la moda"], ["b", "La moda es menor que la media"], ["c", "La media se sitúa por encima de la moda"], ["d", "El coeficiente de variación e recisión del valor estimado"]], "ans": "E"}, {"blk": "B4", "src": "Banco 30", "stem": "En una prueba de hipótesis de media poblacional, cuando la varianza poblacional es conocida, se aplica:", "opts": [["a", "Distribución Binomial"], ["b", "Distribución normal"], ["c", "Distribución F"], ["d", "Distribución t de student"], ["e", "Distribución chi-cuadrado"]], "ans": "B"}, {"blk": "B4", "src": "Banco 31", "stem": "Las medidas de centralización, en cuanto a la información que ofrecen sobre una variable numérica, preferimos (por orden. de peor a mejor):", "opts": [["a", "moda, media, mediana"], ["b", "No se puede en general recomendar una como mejor que las otras"], ["c", "media. mediana, moda"], ["d", "media, moda, mediana."], ["e", "Todas las demás son falsas"]], "ans": "B"}, {"blk": "B4", "src": "Banco 32", "stem": "Si se considera que la aproximación al error de estimación es “alta” una vez determinado un intervalo de confianza, si fuera posible realizar otra estimación del mismo parámetro (suponiendo la misma varianza de la variable en la población), se debería:", "opts": [["a", "Disminuir el tamaño muestral y disminuir el nivel de confianza"], ["b", "Disminuir el tamaño muestral y aumentar el nivel de confianza"], ["c", "Aumentar el tamaño muestral y aumentar el nivel de confianza."], ["d", "Aumentar el tamaño muestral y disminuir el nivel de confianza."], ["e", "Mantener el tamaño muestral y el nivel de confianza"]], "ans": "A, D"}, {"blk": "B4", "src": "Banco 33", "stem": "El error de estimación es:", "opts": [["a", "La diferencia entre los límites del intervalo"], ["b", "La diferencia entre un valor muestral y el parámetro"], ["c", "La resta del límite superior del intervalo y Z"], ["d", "La diferencia entre el estimador y el parámetro"], ["e", "La suma del límite inferior del intervalo y Z"]], "ans": "D"}, {"blk": "B4", "src": "Banco 34", "stem": "El muestreo en donde todas las unidades tienen la misma oportunidad de ser elegidas y la elección de una unidad n n t de student"], ["c", "Distribución gamma"], ["d", "Distribución normal estándar"], ["e", "Distribución normal"]], "ans": "D"}, {"blk": "B4", "src": "Banco 47", "stem": "Una estimación por intervalo provee al profesional o investigador elementos que colaboran a reducir la incertidumbre relacionada a la estimación de un parámetro en base a datos de solo una muestra y son indicadores del grado de bondad para la estimación realizada, ¿cuáles son?", "opts": [["a", "Eficiencia relativa del estimador"], ["b", "Aproximación al error de estimación"], ["c", "Precisión del valor estimado"], ["d", "Esperanza del estimador igual al parámetro"], ["e", "Error máximo aceptable"], ["f", "Potencia de la estimación"]], "ans": "C"}, {"blk": "B4", "src": "Banco 48", "stem": "Es una medida que tiene un valor único, no sufre efectos graves por valores extremos, para su obtención se suele ordenar la serie, esta medida es:", "opts": [["a", "La media aritmética"], ["b", "La media geométrica"], ["c", "La mediana"], ["d", "La moda"], ["e", "La desviación estándar"]], "ans": "C"}, {"blk": "B4", "src": "Banco 49", "stem": "En una estimación por intervalos de la media poblacional, en donde se aplica distribución normal, en el denominador del estadístico Z se utiliza:", "opts": [["a", "La desviación estándar de la media muestral"], ["b", "La varianza de la proporción"], ["c", "La varianza de la media muestral"], ["d", "La varianza de x"], ["e", "La desviación de la proporción muestral"]], "ans": "A"}, {"blk": "B4", "src": "Banco 50", "stem": "Las siguientes medidas son de posición excepto:", "opts": [["a", "Percentil"], ["b", "Deciles"], ["c", "Cuartil"], ["d", "Media (Descarte: a, b, c bien por definición, y e puede representarse con ellas)"], ["e", "Mediana"]], "ans": "D"}, {"blk": "B4", "src": "Banco 51", "stem": "Si una muestra posee valores anómalos, de las siguientes cuál usarías como medida de dispersión:", "opts": [["a", "Desviación típica."], ["b", "Rango."], ["c", "Máximo y coeficiente de variación."], ["d", "Rango intercuartílico"], ["e", "Varianza."]], "ans": "D"}, {"blk": "B4", "src": "Banco 52", "stem": "El tamaño muestral", "opts": [["a", "Ninguna de las Otras es correcta"], ["b", "Se calcula sobre la base de estratificación"], ["c", "Es proporcional al tamaño poblacional"], ["d", "Hay distintos métodos de calcularlo"], ["e", "Es siempre el 5%"]], "ans": "D"}, {"blk": "B4", "src": "Banco 53", "stem": "La moda que es el punto sobre el eje horizontal donde la curva es un máximo Ocurre en x = u . La Curva es simétrica alrededor del eje vertical a través de la media . La curva tiene su punto de inflexión en u +- (varianza). La Curva se aproxima al eje horizontal conforme nos alejamos de la media en cualquier dirección. El área total bajo la curva y sobre el eje horizontal es igual a 1. Estas propiedades describen la curva de la distribución:", "opts": [["a", "T de student"], ["b", "Normal"], ["c", "Chi-cuadrado"], ["d", "Exponencial"]], "ans": "B"}, {"blk": "B4", "src": "Banco 54", "stem": "La hipótesis compuesta, se refiere a un conjunto de valores aproximados que afirmamos o conjeturamos sobre:", "opts": [["a", "El estimador de la muestra"], ["b", "El estimador de una población"], ["c", "El parámetro de la muestra"], ["d", "El parámetro de una población"], ["e", "El nivel de significación"]], "ans": "D"}, {"blk": "B4", "src": "Banco 55", "stem": "La distribución t de Student deriva de la distribución.", "opts": [["a", "Uniforme"], ["b", "Poisson"], ["c", "Binomial"], ["d", "Normal (Google corrobora)"], ["e", "Experimental"]], "ans": "D"}, {"blk": "B4", "src": "Banco 56", "stem": "En estimación por intervalos de media poblacional con varianza conocida, se utiliza:", "opts": [["a", "distribución chi-cuadrado"], ["b", "Distribución t de student"], ["c", "Distribución binomial"], ["d", "Distribución F"], ["e", "Distribución normal"]], "ans": "E"}, {"blk": "B4", "src": "Banco 57", "stem": "En una prueba de hipótesis de proporción poblacional con muestras grandes, se aplica:", "opts": [["a", "Distribución normal"], ["b", "Distribución exponencial"], ["c", "Distribución F"], ["d", "Distribución chi-cuadrado"], ["e", "Distribución t de student"]], "ans": "A"}, {"blk": "B4", "src": "Banco 59", "stem": "En el caso de una variable ordinal, el número n de datos válidos es:", "opts": [["a", "La frecuencia absoluta acumulada de la categoría más frecuente."], ["b", "La suma de las frecuencias absolutas."], ["c", "Ninguna es correcta"], ["d", "La suma de las frecuencias relativas."], ["e", "La frecuencia relativa acumulada en la última categoría."]], "ans": "B"}, {"blk": "B4", "src": "Banco 60", "stem": "Elija la afirmación falsa:", "opts": [["a", "La mediana no se puede calcular en cualquier tipo de variable."], ["b", "En todas las variables numéricas podemos calcular medidas de dispersión."], ["c", "En las variables nominales se pueden calcular percentiles."], ["d", "En todas las variables numéricas podemos calcular medidas de centralización."], ["e", "Una variable sólo puede recibir un valor en cada individuo."]], "ans": "C"}, {"blk": "B4", "src": "Banco 61", "stem": "Cuando se desea encontrar el tamaño de muestra para realizar una estimación de la proporción poblacional, y no se tiene conocimiento o estimación previa de la verdadera proporción, para asegurar un tamaño de muestra más grande, se debería usar.", "opts": [["a", "P = 0.60"], ["b", "Q = 0.40"], ["c", "P = 0.50"], ["d", "Q = 0.60"], ["e", "P = 0.40"]], "ans": "C"}, {"blk": "B4", "src": "Banco 62", "stem": "Cuando no se conoce la probabilidad que tiene la muestra de ser seleccionada, tampoco se puede conocer el error de muestreo y la precisión del estimador, se trata de:", "opts": [["a", "Muestreo aleatorio"], ["b", "Muestreo no probabilístico"], ["c", "Muestreo estratificado"], ["d", "Muestreo sistemático"], ["e", "Muestreo por conglomerados"]], "ans": "B"}, {"blk": "B4", "src": "Banco 63", "stem": "Los límites de un intervalo de confianza de proporción poblacional se obtienen de la siguiente manera:", "opts": [["a", "Parámetro +/- error de estimación"], ["b", "Estimador +/- Z*P"], ["c", "Estimador +/- error de estimación"], ["d", "Estimador +/- desviación de P"], ["e", "Estimador +/- error tipo 1"]], "ans": "C"}, {"blk": "B4", "src": "Banco 64", "stem": "La distribución normal:", "opts": [["a", "Es una distribución de probabilidad de variable discreta"], ["b", "Es bimodal"], ["c", "La mediana no coincide con la moda"], ["d", "Es"], ["e", "Es asintótica"]], "ans": "E"}, {"blk": "B4", "src": "Banco 65", "stem": "Un contraste de hipótesis se considera no significativo si:", "opts": [["a", "La hipótesis nula es más probable que la alternativa."], ["b", "Una muestra aleatoria no es coherente con la hipótesis nula."], ["c", "Una muestra aleatoria es coherente con la hipótesis nula."]], "ans": "A, B"}, {"blk": "B4", "src": "Banco 67", "stem": "La estimación por intervalos consiste en obtener un cierto intervalo aleatorio (Li; Ls), para obtenerlo se parte de:", "opts": [["a", "Un valor cualquiera de la muestra"], ["b", "Un estimador sesgado"], ["c", "Del parámetro"], ["d", "La estimación puntual"], ["e", "Un valor constante"]], "ans": "D"}, {"blk": "B4", "src": "Banco 69", "stem": "Si se tiene la variable Y , la media aritmética cumple la propiedad:", "opts": [["a", "M(K+Y) = k + M(Y)"], ["b", "M(K+x) = k. M(x)"], ["c", "M(K+Y) = x. M(Y)"], ["d", "M(K+Y) = k M(Y)"], ["e", "M(K.Y) = k + M(Y)"]], "ans": "A"}, {"blk": "B4", "src": "Banco 70", "stem": "Si se consideran todos los posibles estimadores insesgados de un parámetro, el que tiene menor variabilidad o dispersión posee la....", "opts": [["a", "propiedad de eficiencia absoluta"], ["b", "propiedad de consistencia"], ["c", "propiedad de eficiencia relativa"], ["d", "propiedad de insesgabilidad"], ["e", "propiedad de suficiencia"]], "ans": "A, C"}, {"blk": "B4", "src": "Banco 73", "stem": "Los \"estratos\" son:", "opts": [["a", "Subpoblaciones homogéneas en la variable en s y negativas."]], "ans": "A"}, {"blk": "B4", "src": "Banco 91", "stem": "El coeficiente de variación:", "opts": [["a", "Depende de la escala que se use al medir la variable."], ["b", "Permite comparar la dispersión de dos poblaciones."], ["c", "No depende de la media ni la desviación típica."], ["d", "Es menor que la desviación típica."], ["e", "Es menor que la media."]], "ans": "B"}, {"blk": "B4", "src": "Banco 92", "stem": "Para un valor de la mediana igual a 8, se interpreta que:", "opts": [["a", "en el 50 % de los elementos el valor observado de la variable es menor a 8"], ["b", "en el 50 % de los elementos los valores observados se diferencian en menos de 8"], ["c", "en el 50 % de los elementos el valor observado de la variable es igual a 8"], ["d", "en el 50 % de los elementos la separación entre el valor observado de la variable y su media es menor a 8"], ["e", "en el 50 % de los elementos el promedio de los valores observados de la variable es igual a 8"]], "ans": "A"}, {"blk": "B4", "src": "Banco 93", "stem": "De los siguientes, qué me puede servir directamente para saber si una observación de una variable aleatoria es anómala:", "opts": [["a", "El valor de la función de densidad."], ["b", "Nada de lo anterior."], ["c", "El valor esperado de la variable."], ["d", "El valor de la función de distribución"], ["e", "El valor de la varianza."]], "ans": "D"}, {"blk": "B4", "src": "Banco 95", "stem": "Las probabilidades (alfa) y (Beta):", "opts": [["a", "No son complementarias"], ["b", "Son complementarias"], ["c", "Son no mutuamente excluyentes"], ["d", "Son mutuamente excluyentes"], ["e", "Siempre varían en el mismo sentido"]], "ans": "A"}, {"blk": "B4", "src": "Banco 96", "stem": "La hipótesis simple se refiere a un valor exacto que afirmamos o conjeturamos sobre:", "opts": [["a", "El estimador de la población"], ["b", "El parámetro de una muestra"], ["c", "El estimador de la muestra"], ["d", "El nivel de significación"], ["e", "El parámetro de una población"]  x = u . La curva es simétrica alrededor del eje vertical a través de la media . La curva tiene su punto de inflexión en u +- (varianza). La curva se aproxima al eje horizontal conforme nos alejamos de la media en cualquier dirección. El área total bajo la curva y sobre el eje horizontal es igual a 1. Estas propiedades describen la curva de la distribución:", "opts": [["a", "T de student"], ["b", "F"], ["c", "Normal"], ["d", "Exponencial"], ["e", "Chi-cuadrado"]], "ans": "C"}, {"blk": "B4", "src": "Banco 104", "stem": "La media, moda y mediana son:", "opts": [["a", "Medidas de variabilidad"], ["b", "Lo primero que hay que calcular"], ["c", "Medidas de la tendencia central"], ["d", "Los tres estadísticos de la población"], ["e", "Los tres parámetros poblacionales"]], "ans": "C"}, {"blk": "B4", "src": "Banco 118", "stem": "En las pruebas de hipótesis, la distribución normal se utiliza para:", "opts": [["a", "Pruebas de medias poblacionales con varianzas muestrales conocidas"], ["b", "Pruebas de medias poblacionales con varianzas poblacionales desconocidas y en una prueba de hipotesis de memuestras pequeñas"], ["c", "Pruebas de medias poblacionales con varianzas poblacionales conocidas"], ["d", "Pruebas de varianzas poblaciones"], ["e", "Pruebas de desviaciones estandares poblacionales"]], "ans": "C"}, {"blk": "B4", "src": "Banco 121", "stem": "Señale cuál o cuáles de las siguientes afirmaciones es verdadera:", "opts": [["a", "La media, la mediana y el rango orientan sobre la tendencia central de los datos."], ["b", "El rango me orienta sobre la simetría de la distribución."], ["c", "Las marcas de clase de una variable cuantitativa se calculan como los puntos medios."], ["d", "La media, mediana y moda resumen todo tipo de información de los datos."], ["e", "La desviación típica me orienta sobre la \"validez\" de la media"]], "ans": "E"}, {"blk": "B4", "src": "Banco 122", "stem": "El coeficiente se lo obtiene de esta = Su información se la usa para saber", "opts": [["a", "La representatividad de la muestra"], ["b", "Los límites muestrales"], ["c", "La curtosis de un conjunto de datos"], ["d", "La simetría de un conjunto de datos"], ["e", "La asimetría de un conjunto de datos"]], "ans": "C"}, {"blk": "B4", "src": "Banco 127", "stem": "La probabilidad de que un evento B ocurra cuando se sabe que ya ocurrió algún evento A, se denota P(B/A) y se llama:", "opts": [["a", "Probabilidad condicional"], ["b", "Probabilidad compuesta"], ["c", "Probabilidad conjunta"], ["d", "Probabilidad total"], ["e", "Probabilidad relativa"]], "ans": "A"}, {"blk": "B4", "src": "Banco 128", "stem": "Si A y B son eventos de un mismo espacio probabilístico entonces:", "opts": [["a", "El complemento de un evento A con respecto al espacio muestral S es el subconjunto de todos los elementos de S que están en A y se denota mediante el símbolo A’: VerdaderoFalso"], ["b", "Dados “n” eventos pertenecientes a un mismo espacio muestral se dice que son mutuamente excluyentes si la ocurrencia de uno de ellos en una prueba del experimento aleatorio, implica la no ocurrencia de los otros n-1 eventos: VerdaderoFalso"], ["c", "Si A y B son dos eventos, no mutuamente excluyentes: P(AUB)=P(A)+P(B)+P(A∩B) VerdaderoFalso"], ["d", "Un experimento aleatorio es cualquier proceso de observación que puede repetirse a voluntad en condiciones análogas, en el cual un resultado no puede ser previsto antes de cada una de sus realizaciones: VerdaderoFalso"]], "ans": "B, D"}, {"blk": "B4", "src": "Banco 129", "stem": "Contestar Verdadero o Falso en cada consigna:", "opts": [["a", "Cada elemento en un espacio muestral se llama punto muestral o evento. Si el espacio muestral tiene un número finito de elementos, podemos listarlos. VerdaderoFalso"], ["b", "La unión de dos eventos A y B, que se denota mediante un símbolo A U B, es el evento que contiene todos los elementos que pertenecen a A o a B o a ambos. VerdaderoFalso"], ["c", "La intersección de dos eventos A y B denotados mediante el sím nen diferente participación en el total y las desviaciones son parecidas, conviene aplicar:", "opts": [["a", "Afijación Óptima"], ["b", "Muestreo Sistemático"], ["c", "Muestreo por conglomerados"], ["d", "Afijación Proporcional"], ["e", "Afijación Igual"]], "ans": "D"}, {"blk": "B4", "src": "Banco 156", "stem": "En una distribución asimétrica positiva o derecha:", "opts": [["a", "La media se sitúa por encima de la moda"], ["b", "la media se sitúa en el mismo lugar que la moda"], ["c", "La moda es mayor a la media"], ["d", "El coeficiente de variación es positivo"], ["e", "La media se sitúa debajo de la moda"]], "ans": "A"}, {"blk": "B4", "src": "Banco 158", "stem": "Un “espacio probabilístico” puede ser:", "opts": [["a", "Aleatorio o determinista"], ["b", "Mutuamente excluyente o no mutuamente excluyente"], ["c", "Cuantitativo o cualitativo"], ["d", "Elemental o compuesto"], ["e", "Discreto o continuo"]], "ans": "E"}, {"blk": "B4", "src": "Banco 162", "stem": "La siguiente función es:", "opts": [["a", "La función de densidad normal"], ["b", "La funcion de acumulacion exponencial"], ["c", "La función del complemento de e"], ["d", "La función de densidad exponencial"], ["e", "La funcion de acumulacion normal"]], "ans": "B"}, {"blk": "B4", "src": "Banco 163", "stem": "Para tomar la decisión de rechazar la hipótesis nula:", "opts": [["a", "El parámetro debe pertenecer al área α"], ["b", "El estimador debe caer en zona de rechazo"], ["c", "El parámetro debe pertenecer a la zona de rechazo"], ["d", "El estadístico debe pertenecer al área β"], ["e", "El estimador debe caer en área α"]], "ans": "B"}, {"blk": "B4", "src": "Banco 165", "stem": "En una distribución normal.", "opts": [["a", "La moda, media y mediana tienen el mismo valor"], ["b", "La media es mayor que la mediana"], ["c", "La media es menor a la mediana y menor a la moda"], ["d", "Todas las otras son falsas"], ["e", "La mediana es mayor que la moda"]], "ans": "A"}, {"blk": "B4", "src": "Banco 167", "stem": "Se 7", "stem": "Se pregunta a los individuos su opinión sobre una cuestión, pudiendo valorar estos su respuesta en términos de: en contra, en parte a favor, muy favor, totalmente de acuerdo. Elija la afirmación correcta:", "opts": [["a", "La variable es de tipo ordinal"], ["b", "la variable es de tipo cualitativo nominal"], ["c", "podemos calcular el coeficiente de variación"], ["d", "ninguna de las otras son ciertas"], ["e", "podemos calcular la media"]], "ans": "A"}, {"blk": "B4", "src": "Banco 211", "stem": "Un estadístico es:", "opts": [["a", "Un valor numérico definido sobre los valores de una población."], ["b", "Ninguna de las otras es correcta."], ["c", "la media muestral."], ["d", "Un valor numérico definido sobre los valores de una muestra."], ["e", "Un individuo de una muestra."]], "ans": "D"}, {"blk": "B4", "src": "Banco 213", "stem": "Entre las medidas de dispersión más importantes, se encuentran:  o más:", "opts": [["a", "Rango, Varianza, Desviación estándar, Rango intercuartil, Moda"], ["b", "Varianza, Rango, Desviación estándar, Mediana, Rango intercuartil"], ["c", "Rango, Varianza, Desviación estándar, Rango intercuartil, Promedio"], ["d", "Rango, Varianza, Desviación estándar, Rango intercuartil, Cuartil"], ["e", "Rango, Varianza, Desviación estándar, Rango intercuartil,Coeficiente"]], "ans": "E"}, {"blk": "B4", "src": "Banco 215", "stem": "Para obtener la potencia de la prueba, se trabaja con:", "opts": [["a", "el error de estimación"], ["b", "hipótesis alternativa cierta"], ["c", "hipótesis alternativa falsa"], ["d", "hipótesis nula cierta"], ["e", "nivel de confianza"]], "ans": "B"}, {"blk": "B4", "src": "Banco 216", "stem": "La desviación estándar:", "opts": [["a", "es una medida de variabilidad solo de los estimadores poblacionales."], ["b", "calcula la estimación bruta del parámetro."], ["c", "es una medida de la variabilidad de los datos"], ["d", "ninguna de las otras es correcta."], ["e", "es una medida de tendencia central."]], "ans": "C"}, {"blk": "B4", "src": "Banco 217", "stem": "Una distribución binomial:", "opts": [["a", "la prueba se realiza una vez, con variable x=0 éxitos, y x=1 fracasos."], ["b", "la desviación típica es PQ/n"], ["c", "es una distribución de probabilidad de variable discreta"], ["d", "la media binomial es P"], ["e", "se define por n.p (número de éxitos)."]], "ans": "C"}, {"blk": "B4", "src": "Banco 219", "stem": "En relación con los contrastes de hipótesis, elija la afirmación correcta:", "opts": [["a", "la hipótesis nula es la falsa"], ["b", "si es más probable que sea cierta la hipótesis alternativa que la nula, el contraste es significativo"], ["c", "la hipótesis nula es la correcta"], ["d", "si la hipótesis alternativa es cierta, seguro se rechaza la nula"], ["e", "el contraste es significativo cuando los datos muestrales no son esperados si la hipótesis nula fuese cierta"]], "ans": "B"}, {"blk": "B4", "src": "Banco 220", "stem": "Una prueba de hipótesis es un experimento aleatorio, en base a las evidencias muestrales y mirando los riesgos de cometer un error, tiene como objetivo rechazar o no rechazar:", "opts": [["a", "el parámetro"], ["b", "el estadígrafo"], ["c", "la hipótesis nula"], ["d", "la hipótesis alternativa"], ["e", "el estadístico"]], "ans": "C"}, {"blk": "B4", "src": "Banco 223", "stem": "Elija la afirmación falsa:", "opts": [["a", "un contraste es declarado significativo si se obtiene una muestra que discrepa mucho de la hipótesis nula"], ["b", "la significación de un contraste es conocida tras analizar los datos"], ["c", "el nivel de significación de un contraste debe ser fijado antes de analizar los datos"], ["d", "el nivel de significación es normalmente un valor pequeño"], ["e", "un contraste debe ser declarado significativo antes de recoger los datos"]], "ans": "E"}, {"blk": "B4", "src": "Banco 224", "stem": "La función de probabilidad es de la distribución:", "opts": [["a", "Hipergeométrica"], ["b", "Poisson"], ["c", "Normal"], ["d", "Exponencial"], ["e", "Gamma"]], "ans": "B"}, {"blk": "B4", "src": "Banco 225", "stem": "En general, una unidad de relevamiento es… seleccione una o más:", "opts": [["a", "una característica observable en los elementos o casos que forman la población"], ["b", "un agrupamiento de elementos o casos que forman la población"], ["c", "una fuente de datos primarios de los elementos o casos que forman la población"], ["d", "una manera de obtener datos de los elementos o casos que forman la población"], ["e", "una muestra de elementos o casos que forman la población"]], "ans": "B, C"}, {"blk": "B4", "src": "Banco 227", "stem": "Si queremos saber cómo de dispersó está una variable relativamente con respecto a la magnitud de los valores centrales de la misma, usaremos:", "opts": [["a", "rango intercuartílico"], ["b", "coeficiente de variación"], ["c", "desviación típica"], ["d", "rango"], ["e", "varianza"]], "ans": "C"}, {"blk": "B4", "src": "Banco 230", "stem": "Si la variable aleatoria X toma los valores x1, x2, x3 ...xk con idénticas probabilidades, la distribución de probabilidades está dada por f(x,k)=1/k:", "opts": [["a", "Uniforme discreta"], ["b", "Poisson"], ["c", "Binomial"], ["d", "Uniforme continua"], ["e", "Hipergeométrica"]], "ans": "A"}, {"blk": "B4", "src": "Banco 231", "stem": "La variable aleatoria discreta x puede asumir valores que van desde 0 a n. En caso de que k sea menor a n, la variable x puede asumir valores hasta k. En el caso que el tamaño de la muestra represente más de un 5% respecto de la población en el estudio, es aplicable este modelo. Nos referimos al modelo:", "opts": [["a", "Hipergeométrico"], ["b", "Uniforme"], ["c", "Binomial"], ["d", "Poisson"], ["e", "Bipuntual"]], "ans": "A"}, {"blk": "B4", "src": "Banco 233", "stem": "La esperanza matemática de la distribución es E(x) = np y la varianza es V(x) = nP(1-P)(N-n/N-1) se trata de la distribución:", "opts": [["a", "Poisson"], ["b", "Binomial"], ["c", "Exponencial"], ["d", "Proporción muestral"], ["e", "Hipe os."], ["e", "La media de la Binomial es P"]], "ans": "C"}, {"blk": "B4", "src": "Banco 271", "stem": "Se realiza una auditoría de historias clínicas tomando una primera historia al azar y después sucesivamente, la que ocupa la vigésima posición detrás de la anterior. Este procedimiento de muestreo se denomina: seleccione una", "opts": [["a", "consecutivo"], ["b", "equidistante"], ["c", "por conglomerados"], ["d", "sistemático"], ["e", "correlativo 271) en la base teórica del muestreo se dice que los datos estadísticos poseen dos importantes características, ellas son: seleccione una:"], ["a", "regularidad y similitud"], ["b", "exactitud y regularidad"], ["c", "diversidad y regularidad o uniformidad"], ["d", "regularidad y uniformidad"], ["e", "pluralidad e irregularidad d"]], "ans": "C, D"}, {"blk": "B4", "src": "Banco 272", "stem": "La población se divide en grupos, los grupos son internamente heterogéneos y externamente homogéneos. Se espera que cada grupo sea representativo de la población. se trata del muestreo:", "opts": [["a", "discrecional"], ["b", "aleatorio"], ["c", "estratificado"], ["d", "por conglomerados"], ["e", "sistemático"]], "ans": "D"}, {"blk": "B4", "src": "Banco 274", "stem": "El coeficiente cuyo resultado se obtiene de esta manera: , se lo utiliza para saber ...", "opts": [["a", "La asimetría de un conjunto de datos."], ["b", "Si la curva es mesocúrtica"], ["c", "Si la curva es platicúrtica"], ["d", "Si la curva es platicúrtica"], ["e", "Si el conjunto de datos es homogéneo pearson toma la media de muestra"]], "ans": "A"}, {"blk": "B4", "src": "Banco 277", "stem": "¿cual de las siguientes características no se corresponde con el concepto de mediana? seleccione una:", "opts": [["a", "es el segundo cuartil"], ["b", "deja por debajo el mismo número de datos que por encima"], ["c", "todo lo anterior se corresponde con la mediana"], ["d", "no se ve afectada por los valores extremos"], ["e", "es el centro de gravedad de la distribución"]], "ans": "D  ¿cuál será la mejor estimación del número de pacientes que tienen un nivel de glucemia entre 90 y 105", "opts": [["a", "15."], ["b", "17"], ["c", "20"], ["d", "25"], ["e", "34"]], "ans": "B"}, {"blk": "B1", "src": "Preg. 29", "stem": "En una población, hay tantos hombres como mujeres, el 20% son varones y fumadores y el 20% de las mujeres fuman. Entonces:", "opts": [["a", "Fuman tantos hombres como mujeres."], ["b", "Por cada mujer fumadora hay dos hombres fumadores."], ["c", "Por cada hombre fumador hay dos mujeres fumadoras."], ["d", "Hay un 40% de fumadores en la población."], ["e", "Nada de lo anterior es cierto."]], "ans": "B"}, {"blk": "B1", "src": "Preg. 30", "stem": "En una población, el peso tiene media 60kg y desviación típica 6Kg. La altura tiene de media 170cm y desviación 6cm. Cierto individuo tiene un peso de 70 Kg y altura 180cm.", "opts": [["a", "La altura tiene un valor más extremo que el peso."], ["b", "El peso es menos extremo que la altura."], ["c", "Peso y altura son valores igualmente extremos."], ["d", "El peso es más extremo que la altura."], ["e", "La altura es menos extrema que el peso."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 36", "stem": "En una población se obtiene con una bondad de ajuste de 0,9 que la relación entre nivel de glucemia (Y) y nivel de colesterol (X) es de Y=20 + X/4. Entonces:", "opts": [["a", "Todos los individuos con un valor de colesterol 100, presentan glucemia 45."], ["b", "Existe tendencia a que a mayor nivel de glucemia, mayor nivel de colesterol."], ["c", "Hay mas individuos con colesterol alto que con glucemia baja."], ["d", "Las observaciones se muestran como una nube de puntos creciente."], ["e", "Sólo dos de las afirmaciones anteriores son correctas."]], "ans": "E"}, {"blk": "B1", "src": "Preg. 55", "stem": "Para estudiar la efectividad de un test diagnóstico ante una enfermedad se toma un grupo de 200 personas enfermas y 200 que no la padecen, y se observan los resultados. ¿Qué podemos estimar directamente de ellos?", "opts": [["a", "La sensibilidad y especificidad del test."], ["b", "La incidencia de la enfermedad en la población."], ["c", "El índice predictivo de verdaderos positivos."], ["d", "Son correctas (a) y (c)."], ["e", "Todo lo anterior."]], "ans": "A"}, {"blk": "B1", "src": "Preg. 77", "stem": "El 12% de los individuos de una población padece osteoporosis. EL 25% de ellos lo sabe. ¿Qué tasa de individuos tiene osteoporosis y lo desconoce?", "opts": [["a", "3%"], ["b", "6%"], ["c", "9%"], ["d", "12%"], ["e", "25%"]], "ans": "C"}, {"blk": "B1", "src": "Preg. 78", "stem": "La osteoporosis afecta 4 veces más a mujeres que a hombres. El 8% de las mujeres padece osteoporosis en una población donde hay tantos hombres como mujeres. ¿Cuál es la prevalencia de la osteoporosis en la población?", "opts": [["a", "2%"], ["b", "5%"], ["c", "8%"], ["d", "10%"], ["e", "12%"]], "ans": "B"}, {"blk": "B1", "src": "Preg. 81", "stem": "El nivel medio de glucemia en una población tiene un comportamiento gausiano co n media 150mg/dl, y un coeficiente de variación del 10%. Entre qué valores se situa el 95% de los individuos de la población.", "opts": [["a", "Entre 140 y 160."], ["b", "Entre 130 y 170."], ["c", "Entre 120 y 180."], ["d", "Entre 110 y 190."], ["e", "Entre 100 y 200."]], "ans": "C"}, {"blk": "B1", "src": "Preg. 91", "stem": "El perímetro torácico en un grupo de militares presenta distribución gaussiana con 95 cm de media y 5 cm de desviación típica. Elegimos a una muestra de 100 indivíduos y calculamos la media de la misma. Elija la afirmación correcta:", "opts": [["a", "La media de la muestra valdrá 95cm."], ["b", "La media de la muestra sería un valor comprendido entre 90 y 100 cm con confianza del 68%."], ["c", "La media de la muestra será un valor comprendido entre 95 y 100 cm con confianza del 95%."], ["d", "La media de la muestra será un valor comprendido entre 94 y 96 cm con confianza del 95%."], ["e", "Todo lo anterior es falso."]], "ans": "D"}, {"blk": "B const ALL=[...D.T.map(q=>({...q,t:'T'})),...D.R.map(q=>({...q,t:'R'}))];
ALL.forEach(q=>{q.id=q.src;
 if(!q.parts&&q.opts&&q.opts.length&&/^[A-I](, [A-I])*$/.test(q.ans||'')){
  const ls=q.ans.split(', ').map(x=>x.toLowerCase());
  q.parts=[{p:'',o:q.opts.map(([l,t])=>l+') '+t),c:q.opts.map(([l])=>l.toLowerCase()).map((l,i)=>ls.includes(l)?i:-1).filter(i=>i>=0),m:ls.length>1}];
 }});
const $=id=>document.getElementById(id);
let Q=[],i=0,st={},sel=[],done=false;
try{st=JSON.parse(localStorage.getItem('pye_st2')||'{}')}catch(e){st={}}
const save=()=>{try{localStorage.setItem('pye_st2',JSON.stringify(st))}catch(e){}};
function build(){
 const t=$('tipo').value,b=$('blk').value;
 Q=ALL.filter(q=>(t==='all'||q.t===t)&&(b==='all'||q.blk===b));
 if($('ord').value==='rnd')Q.sort(()=>Math.random()-.5);
 i=0;$('quiz').classList.remove('hide');draw();
}
function stats(){let ok=0,bad=0;Q.forEach(q=>{const s=st[q.id];if(s===1)ok++;else if(s===0)bad++});return{ok,bad}}
function head2(){const {ok,bad}=stats();$('score').textContent='Correctas: '+ok+' · Incorrectas: '+bad;$('bar').style.width=(Q.length?100*(ok+bad)/Q.length:0)+'%';nav()}
function draw(){
 $('opts').innerHTML='';$('out').innerHTML='';$('extra').textContent='';
 if(!Q.length){$('stem').textContent='No hay preguntas con ese filtro.';return}
 const q=Q[i];done=false;
 $('src').textContent=q.src;
 const multi=q.parts&&q.parts.some(p=>p.m);
 $('kind').textContent=(q.t==='T'?'Teórica':'Práctica')+(multi?' · puede haber varias correctas':'');
 $('stem').textContent=q.stem;
 $('pos').textContent='Pregunta '+(i+1)+' de '+Q.length;
 sel=[];
 if(q.parts){
  q.parts.forEach((p,pi)=>{
   sel.push(new Set());
   const g=document.createElement('div');g.style.marginTop='10px';
   if(p.p){const h=document.createElement('div');h.style.fontWeight='600';h.textContent=p.p;g.appendChild(h)}
   p.o.forEach((t,oi)=>{
    const L=document.createElement('label');L.className='opt';L.dataset.p=pi;L.dataset.o=oi;
    L.innerHTML='<input type="'+(p.m?'checkbox':'radio')+'" name="p'+pi+'"><span></span>';L.lastChild.textContent=t;
    L.firstChild.addEventListener('change',e=>{if(done)return;
     if(p.m){e.target.checked?sel[pi].add(oi):sel[pi].delete(oi)}else{sel[pi]=new Set([oi])}
     g.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',sel[pi].has(+o.dataset.o)))});
    g.appendChild(L)});
   $('opts').appendChild(g)});
  $('chk').textContent='Comprobar';$('chk').disabled=false;
 }else{
  $('extra').textContent='Esta pregunta no tiene opciones cargadas.';
  $('out').innerHTML='<div class="ans"></div>';$('out').firstChild.textContent='Respuesta: '+q.ans;$('chk').disabled=true;
 }
 $('prev').disabled=i===0;$('next').disabled=i===Q.length-1;head2();
}
function nav(){const n=$('nav');n.innerHTML='';Q.forEach((q,j)=>{const b=document.createElement('b');b.textContent=j+1;const s=st[q.id];
 b.className=(j===i?'cur ':'')+(s===1?'ok':s===0?'bad':'');b.onclick=()=>{i=j;draw()};n.appendChild(b)})}
$('chk').onclick=()=>{
 if(!Q.length||done)return;const q=Q[i];
 if(sel.some(s=>!s.size)){$('out').innerHTML='<div class="fb bad">Elegí una opción en cada parte antes de comprobar.</div>';return}
 done=true;let all=true;const fix=[];
 q.parts.forEach((p,pi)=>{
  const right=p.c.length===sel[pi].size&&p.c.every(x=>sel[pi].has(x));if(!right)all=false;
  document.querySelectorAll('.opt[data-p="'+pi+'"]').forEach(o=>{const oi=+o.dataset.o;o.querySelector('input').disabled=true;
   if(p.c.includes(oi)&&sel[pi].has(oi))o.classList.add('ok');else if(p.c.includes(oi))o.classList.add('miss');else if(sel[pi].has(oi))o.classList.add('bad')});
  if(!right)fix.push((p.p?p.p+' → ':'')+p.c.map(x=>p.o[x]).join(' · '));
 });
 const f=document.createElement('div');f.className='fb '+(all?'ok':'bad');
 f.textContent=all?'Correcto.':'Incorrecto. La respuesta correcta es:\n'+fix.join('\n');f.style.whiteSpace='pre-wrap';
 $('out').innerHTML='';$('out').appendChild(f);
 st[q.id]=all?1:0;save();$('chk').disabled=true;head2();
};
$('next').onclick=()=>{if(i<Q.length-1){i++;draw()}};
$('prev').onclick=()=>{if(i>0){i--;draw()}};
$('go').onclick=build;
$('reset').onclick=()=>{st={};save();if(Q.length)draw()};
$('theme').onclick=()=>{const r=document.documentElement,c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':'dark')};
</script></body></html>
